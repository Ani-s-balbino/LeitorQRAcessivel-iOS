name: LeitorQRAcessivel
options:
  bundleIdPrefix: br.com.leitorqr
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  LeitorQRAcessivel:
    type: application
    platform: iOS
    sources:
      - path: LeitorQRAcessivel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.leitorqr.ios
        INFOPLIST_FILE: LeitorQRAcessivel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
        ENABLE_PREVIEWS: NO
